<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交易看板</title>
<style>
:root{--bg:#0f172a;--s:#1e293b;--s2:#273548;--b:#334155;--t:#e2e8f0;--tm:#94a3b8;--td:#64748b;--buy:#10b981;--sell:#ef4444;--hold:#f59e0b;--wait:#6366f1;--acc:#6366f1;--r:10px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
.c{max-width:960px;margin:0 auto;padding:16px}
/* Shared header */
.hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.hd h1{font-size:1.3rem;font-weight:700}
.hd-ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pbar{display:inline-flex;background:var(--s);border-radius:20px;padding:3px}
.pbar button{border:none;background:transparent;color:var(--tm);padding:5px 14px;border-radius:16px;font-size:.85rem;cursor:pointer;transition:.2s}
.pbar button.on{background:var(--acc);color:#fff;font-weight:600}
.dbar{display:inline-flex;align-items:center;gap:4px;background:var(--s);border-radius:20px;padding:4px 10px}
.dbar button{background:transparent;border:none;color:var(--tm);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
.dbar button:hover{background:var(--s2);color:var(--t)}
.dbar input{width:120px;text-align:center;border:none;background:transparent;color:var(--t);font-weight:600;font-size:.85rem}
.dbar input::-webkit-calendar-picker-indicator{filter:invert(.8);cursor:pointer}
.today-badge{font-size:.75rem;color:var(--acc);border:1px solid var(--acc);border-radius:10px;padding:2px 8px;cursor:pointer}
.today-badge:hover{background:var(--acc);color:#fff}
/* Module */
.module{background:var(--s);border-radius:var(--r);padding:16px;margin-bottom:16px}
.module h2{font-size:1.1rem;margin:0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.module h2:hover{color:#fff}
.module h2 .toggle{font-size:.8rem;transition:transform .2s;margin-right:6px}
.module h2 .toggle.folded{transform:rotate(-90deg)}
.module h2 .actions{display:flex;gap:6px;margin-left:auto}
.module .mod-body{transition:max-height .3s ease,opacity .3s ease;overflow:hidden}
.module .mod-body.hidden{max-height:0;opacity:0;margin:0}
/* Sub-tabs (Module 1) */
.tabs{display:flex;gap:0;margin-bottom:12px;background:rgba(0,0,0,.3);border-radius:8px;overflow:hidden}
.tabs button{flex:1;border:none;background:transparent;color:var(--tm);padding:8px;font-size:.8rem;font-weight:600;cursor:pointer;transition:.2s}
.tabs button.on{background:var(--acc);color:#fff}
/* Cards */
.card{background:rgba(0,0,0,.2);border-radius:8px;padding:14px;margin-bottom:10px}
.card h3{font-size:.95rem;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.card .cname{color:var(--tm);font-weight:400}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
input,textarea,select,button{font-family:inherit;font-size:.9rem}
input,textarea,select{background:rgba(0,0,0,.3);border:1px solid var(--b);color:var(--t);padding:7px 10px;border-radius:7px;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
textarea{width:100%;resize:vertical}
.btn{background:var(--acc);color:#fff;border:none;padding:7px 14px;border-radius:7px;font-weight:600;cursor:pointer;font-size:.85rem;transition:.2s}
.btn:hover{opacity:.9}
.btn-sm{font-size:.75rem;padding:4px 10px}
.btn-out{background:transparent;border:1px solid var(--b);color:var(--tm)}
.btn-out:hover{background:rgba(255,255,255,.05)}
.btn-danger{background:transparent;color:var(--sell);border:1px solid var(--sell)}
.btn-danger:hover{background:rgba(239,68,68,.15)}
.btn-done{background:var(--buy);color:#fff}
/* K-line */
.kline-wrap{display:none;margin-top:8px}
.kline-wrap.show{display:block}
.kline-wrap iframe,.kline-wrap img{width:100%;border-radius:8px;border:1px solid var(--b)}
.kline-wrap img{max-width:600px}
/* Decision buttons */
.dec-btns{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.dec-btn{border:2px solid var(--b);background:transparent;color:var(--tm);padding:4px 10px;border-radius:14px;font-size:.78rem;font-weight:600;cursor:pointer;transition:.2s}
.dec-btn:hover{border-color:var(--tm)}
.dec-btn.sel-buy{border-color:var(--buy);background:rgba(16,185,129,.15);color:var(--buy)}
.dec-btn.sel-sell{border-color:var(--sell);background:rgba(239,68,68,.15);color:var(--sell)}
.dec-btn.sel-hold_position{border-color:var(--hold);background:rgba(245,158,11,.15);color:var(--hold)}
.dec-btn.sel-hold_empty{border-color:var(--wait);background:rgba(99,102,241,.15);color:var(--wait)}
/* Plan */
.plan-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.label-row span{font-size:.75rem;color:var(--tm);font-weight:600}
.views-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.views-grid .col{background:rgba(0,0,0,.2);border-radius:8px;padding:8px}
.views-grid .col h4{font-size:.78rem;color:var(--tm);margin-bottom:5px}
.views-grid textarea{height:60px;font-size:.85rem}
.judgments{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jcell{background:rgba(0,0,0,.2);border-radius:8px;padding:10px;cursor:pointer;border:2px solid transparent;transition:.2s}
.jcell:hover{border-color:var(--b)}
.jcell.empty{border-style:dashed;border-color:var(--b)}
.jcell.buy{border-color:var(--buy);background:rgba(16,185,129,.1)}
.jcell.sell{border-color:var(--sell);background:rgba(239,68,68,.1)}
.jcell.hold{border-color:var(--hold);background:rgba(245,158,11,.1)}
.jcell .who{font-size:.7rem;color:var(--tm);font-weight:600}
.badge{display:inline-block;font-weight:700;font-size:.75rem;padding:2px 8px;border-radius:10px}
.badge.buy{color:var(--buy);background:rgba(16,185,129,.18)}
.badge.sell{color:var(--sell);background:rgba(239,68,68,.18)}
.badge.hold{color:var(--hold);background:rgba(245,158,11,.18)}
.exec-row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.tag{display:inline-block;font-size:.68rem;padding:2px 6px;border-radius:8px;font-weight:600}
.tag-followed{background:rgba(16,185,129,.2);color:var(--buy)}
.tag-deviated{background:rgba(239,68,68,.2);color:var(--sell)}
.tag-pending{background:rgba(245,158,11,.2);color:var(--hold)}
.tag-expired{background:rgba(100,116,139,.2);color:var(--td)}
/* Holdings */
.hTable{width:100%;border-collapse:collapse;font-size:.82rem}
.hTable th,.hTable td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--b)}
.hTable th{color:var(--tm);font-weight:600;font-size:.7rem;text-transform:uppercase;background:rgba(0,0,0,.2)}
.hTable td:first-child,.hTable th:first-child{text-align:left}
.hTable .pnl-pos{color:var(--buy)}
.hTable .pnl-neg{color:var(--sell)}
.hTable .editable{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.hTable .editable:hover{color:#fff}
.bar-cell{position:relative;min-width:60px}
.bar-bg{position:absolute;right:0;top:2px;bottom:2px;border-radius:3px;opacity:.3;min-width:2px}
.bar-pos{background:var(--buy)}
.bar-neg{background:var(--sell)}
.wbar{height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:2px;overflow:hidden}
.wbar-fill{height:100%;border-radius:2px;background:var(--acc);transition:width .3s}
.risk-warn{animation:pulse-warn 2s infinite}
@keyframes pulse-warn{0%,100%{background:rgba(239,68,68,0)}50%{background:rgba(239,68,68,.15)}}
.holding-preview{opacity:.4;font-style:italic}
.inline-input:focus{outline:none}
.hTable .pnl-pos{color:var(--buy)}
.hTable .pnl-neg{color:var(--sell)}
/* Review */
.review-item{background:rgba(0,0,0,.2);border-radius:8px;padding:12px;margin-bottom:8px;border-left:3px solid var(--b)}
.review-item.ok{border-left-color:var(--buy)}
.review-item.bad{border-left-color:var(--sell)}
/* Market notes */
.note-card{background:rgba(0,0,0,.2);border-radius:8px;padding:12px;margin-bottom:8px}
.note-card .nmeta{font-size:.75rem;color:var(--tm);margin-bottom:4px}
.note-card .ntitle{font-weight:600;margin-bottom:4px}
.note-card .nsummary{font-size:.85rem;color:var(--tm);line-height:1.5}
/* Empty & Toast */
.empty{text-align:center;padding:32px 16px;color:var(--td)}
.empty .icon{font-size:2.5rem;margin-bottom:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#334155;color:#e2e8f0;padding:8px 20px;border-radius:20px;font-size:.85rem;z-index:200;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.overlay.hidden{display:none}
.modal{background:var(--s);border-radius:14px;padding:20px;width:100%;max-width:420px}
.modal h3{font-size:1rem;margin-bottom:3px}
.modal .sub{color:var(--tm);font-size:.8rem;margin-bottom:10px}
.deco{display:flex;gap:6px;margin-bottom:10px}
.deco button{flex:1;border:2px solid var(--b);background:transparent;color:var(--tm);padding:8px 4px;border-radius:8px;font-weight:700;font-size:.8rem;cursor:pointer}
.deco button.sel-buy{border-color:var(--buy);background:rgba(16,185,129,.15);color:var(--buy)}
.deco button.sel-sell{border-color:var(--sell);background:rgba(239,68,68,.15);color:var(--sell)}
.deco button.sel-hold{border-color:var(--hold);background:rgba(245,158,11,.15);color:var(--hold)}
.modal textarea{height:80px}
.mbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.summary-bar{display:flex;gap:16px;flex-wrap:wrap;padding:10px 14px;background:rgba(99,102,241,.1);border-radius:8px;margin-bottom:12px;font-size:.85rem}
.summary-bar span{font-weight:700}
@media(max-width:600px){.plan-row,.views-grid,.judgments{grid-template-columns:1fr}.hd{flex-direction:column;align-items:flex-start}.hTable{font-size:.75rem}}
</style>
</head>
<body>
<div class="c">
  <!-- Shared Header -->
  <div class="hd">
    <h1>📈 交易看板</h1>
    <div class="hd-ctl">
      <div class="pbar" id="pbar"><button data-p="A">👤 A</button><button data-p="B">👤 B</button></div>
      <div class="dbar">
        <button id="btnPrev">◀</button><input type="date" id="dInput"><button id="btnNext">▶</button>
        <span class="today-badge" id="btnToday">今天</span>
      </div>
    </div>
  </div>

  <!-- Module 1: 交易纪律看板 -->
  <div class="module">
    <h2 onclick="toggleModule('m1body')"><span><span class="toggle" id="m1body_tgl">▼</span>📋 交易纪律看板</span><span class="actions" onclick="event.stopPropagation()"></span></h2>
    <div class="mod-body" id="m1body">
    <div class="tabs" id="m1tabs" style="margin-top:12px">
      <button data-tab="plan" class="on">📋 今日计划</button>
      <button data-tab="journal">📝 盘后记录</button>
      <button data-tab="review">📊 回顾</button>
    </div>
    <div id="m1"></div>
    </div>
  </div>

  <!-- Module 2: 持仓管理 -->
  <div class="module">
    <h2 onclick="toggleModule('m2body')"><span><span class="toggle" id="m2body_tgl">▼</span>📊 持仓管理</span><span class="actions" onclick="event.stopPropagation()"><button class="btn btn-sm" id="btnRefreshPrice">🔄 刷新行情</button><button class="btn btn-sm" id="btnAddHolding">+ 添加</button></span></h2>
    <div class="mod-body" id="m2body">
    <div id="m2Cash" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:rgba(99,102,241,.08);border-radius:8px;margin-bottom:10px;font-size:.85rem">
      <span style="color:var(--tm)">💰 现金</span>
      <input id="cashAmount" type="number" step="1" placeholder="现金金额" style="width:120px" onchange="saveCash()">
      <span style="color:var(--tm)">货币</span>
      <select id="cashCurrency" onchange="saveCash()" style="width:70px"><option value="¥">¥ 人民币</option><option value="HK$">HK$ 港币</option><option value="US$">US$ 美元</option></select>
      <span id="cashRatio" style="color:var(--t);font-weight:700"></span>
    </div>
    <div id="m2Alloc" style="margin-bottom:10px;padding:10px 14px;background:rgba(0,0,0,.15);border-radius:8px;display:none">
      <div style="font-size:.8rem;color:var(--tm);margin-bottom:6px">🏦 资产分配</div>
      <div style="display:flex;height:24px;border-radius:12px;overflow:hidden;margin-bottom:6px">
        <div id="stockBar" style="background:var(--acc);transition:width .3s;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#fff"></div>
        <div id="cashBar" style="background:var(--buy);transition:width .3s;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#fff"></div>
      </div>
      <div style="display:flex;gap:20px;font-size:.78rem;color:var(--tm)">
        <span>🔵 股票 <b id="stockPct">-</b></span>
        <span>🟢 现金 <b id="cashPct">-</b></span>
        <span>总资产 <b id="totalAsset" style="color:var(--t)">-</b></span>
      </div>
    </div>
    <div id="m2Summary" class="summary-bar" style="display:none"></div>
    <div id="m2"></div>
    </div>
  </div>

  <!-- Module 3: 市场信息 -->
  <div class="module">
    <h2 onclick="toggleModule('m3body')"><span><span class="toggle" id="m3body_tgl">▼</span>📰 市场信息</span><span class="actions" onclick="event.stopPropagation()"><button class="btn btn-sm" id="btnAddNote">+ 添加链接</button></span></h2>
    <div class="mod-body" id="m3body">
    <div id="m3"></div>
    </div>
  </div>

</div>

<!-- Judgment Modal -->
<div class="overlay hidden" id="modal">
  <div class="modal">
    <h3 id="mTitle">—</h3><div class="sub" id="mSub">—</div>
    <div class="deco" id="decoGroup">
      <button data-a="buy">🟢 买入</button><button data-a="sell">🔴 卖出</button><button data-a="hold">🟡 观望</button>
    </div>
    <textarea id="mReason" placeholder="填写判断理由..."></textarea>
    <div class="mbtn"><button class="btn" style="background:transparent;border:1px solid var(--b);color:var(--tm)" id="btnCancel">取消</button><button class="btn" id="btnSave">保存</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ─── Config ───
const API={url:'https://wkhxlgxicirbfyjoelbi.supabase.co',key:'sb_publishable_029D-rP7Zdo2dgF4WrniTQ_SMaPVTqT'};
const HG={apikey:API.key,Authorization:'Bearer '+API.key};
const HP={...HG,'Content-Type':'application/json',Prefer:'return=representation'};
const Q=s=>document.querySelector(s),QA=s=>document.querySelectorAll(s);
let date=new Date().toISOString().slice(0,10),person=localStorage.getItem('sp')||'A';
let stocks=[],plans=[],logs=[],activeTab='plan';
let holdings=[];
const DECISIONS={buy:'🟢 买入',sell:'🔴 卖出',hold_position:'🟡 持仓观望',hold_empty:'🔵 空仓观望'};
function pname(p){return p==='A'?'A':'B';}
function currency(mkt){return mkt==='hk'?'HK$':mkt==='us'?'US$':'¥';}
function guessMarket(code){
  if(!code)return'sz';
  if(/^[A-Z]/i.test(code))return'us';
  if(code.startsWith('6')||code.startsWith('5'))return'sh';
  if(code.startsWith('0')||code.startsWith('3'))return'sz';
  if(code.length<=5&&/^\d+$/.test(code))return'hk';
  return'sz';
}

// ─── API helpers ───
async function get(p){const r=await fetch(API.url+p,{headers:HG});if(!r.ok)throw new Error(r.status);return r.json()}
async function post(p,b){const r=await fetch(API.url+p,{method:'POST',headers:HP,body:JSON.stringify(b)});if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||r.statusText)}return r.json()}
async function patch(p,b){const r=await fetch(API.url+p,{method:'PATCH',headers:HP,body:JSON.stringify(b)});if(!r.ok)throw new Error(r.statusText)}
async function del(p){const r=await fetch(API.url+p,{method:'DELETE',headers:HG});if(!r.ok)throw new Error(r.statusText)}
function toast(m){const t=Q('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2000)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmt(d){const[y,m,day]=d.split('-');return y+'年'+parseInt(m)+'月'+parseInt(day)+'日'}
function isToday(d){return d===new Date().toISOString().slice(0,10)}
function shift(d,n){const dt=new Date(d+'T00:00:00');dt.setDate(dt.getDate()+n);return dt.toISOString().slice(0,10)}
function today(){return new Date().toISOString().slice(0,10)}
function mktCode(c,m){if(m==='hk')return'116';if(m==='us')return'105';return c.startsWith('6')?'1':'0'}
function exg(c,m){if(m==='hk')return'hk';if(m==='us')return'us';return m||(c.startsWith('6')?'sh':'sz')}
function prefix(c,m){if(m==='hk')return'HKEX';if(m==='us')return c.toUpperCase();return c.startsWith('6')?'SSE':'SZSE'}

// ─── Name lookup ───
async function lookupName(code,mkt){
  if(!code||code.length<2)return null;
  const h=Q('#nameHint');if(h)h.textContent='查询中...';
  let sym;if(mkt==='hk')sym='hk'+code.padStart(5,'0');else if(mkt==='us')sym='us'+code.toUpperCase();else sym=exg(code,mkt)+code;
  try{
    const r=await fetch(`https://qt.gtimg.cn/q=${sym}`);if(!r.ok)throw new Error();
    const buf=await r.arrayBuffer();const dec=new TextDecoder('gbk');const text=dec.decode(buf);
    const m=text.match(/~([^~]+)~/);if(m&&m[1]&&m[1]!==code&&!m[1].startsWith('51')){if(h)h.textContent='✅ '+m[1];return m[1]}
  }catch(e){}
  if(h)h.textContent='未找到';return null;
}

// ─── Price lookup ───
async function fetchPrice(code,mkt){
  try{
    const mc=mktCode(code,mkt);const sec=mc+'.'+code;
    const r=await fetch(`https://push2.eastmoney.com/api/qt/stock/get?secid=${sec}&fields=f43`);
    const j=await r.json();if(j.data&&j.data.f43)return j.data.f43/100;
  }catch(e){}return null;
}

// ─── M1: 交易纪律看板 ───
async function loadM1(){
  try{
    const all=await get('/rest/v1/stocks?select=*&order=created_at.asc');
    stocks=all.filter(s=>{const f=s.active_from||'2000-01-01';const u=s.active_until||'2099-12-31';return f<=date&&u>=date;});
  }catch(e){stocks=[]}
  try{plans=await get(`/rest/v1/daily_plans?select=*&plan_date=eq.${date}`);}catch(e){plans=[]}
  try{logs=await get(`/rest/v1/execution_logs?select=*&log_date=eq.${date}`);}catch(e){logs=[]}
}
async function addStock(){
  const ce=Q('#inCode'),ne=Q('#inName'),me=Q('#inMkt');
  if(!ce||!ne)return toast('页面异常，请刷新');
  const code=ce.value.trim(),name=ne.value.trim(),mkt=me?me.value:'sz';
  if(!code||!name)return toast('请输入股票代码和名称');
  try{await post('/rest/v1/stocks',{code,name,market:mkt,active_from:today()});ce.value='';ne.value='';const nh=Q('#nameHint');if(nh)nh.textContent='';toast('添加成功');await loadM1();renderM1();}catch(e){toast('添加失败：'+e.message)}
}
async function stopStock(id){
  if(!confirm('确定停止追踪？历史保留，明天起不显示。'))return;
  await patch(`/rest/v1/stocks?id=eq.${id}`,{active_until:today()});toast('已停止追踪');await loadM1();renderM1();
}
async function delStock(id){
  if(!confirm('永久删除该股票所有数据？不可恢复！'))return;
  await del(`/rest/v1/judgments?stock_id=eq.${id}`);await del(`/rest/v1/daily_plans?stock_id=eq.${id}`);await del(`/rest/v1/execution_logs?plan_id=eq.${id}`);await del(`/rest/v1/stocks?id=eq.${id}`);
  toast('已永久删除');await loadM1();renderM1();
}
async function savePlan(sid){
  const pfx='plan_'+sid;
  const ad=Q('#'+pfx+'_ad').value,bd=Q('#'+pfx+'_bd').value;
  const body={stock_id:sid,plan_date:date,a_decision:ad,b_decision:bd,

function updateAllocation(totalStockVal){
  const cash=loadCash(),totalAsset=totalStockVal+cash.amount;
  const sp=totalAsset>0?(totalStockVal/totalAsset*100):0,cp=totalAsset>0?(cash.amount/totalAsset*100):0;
  Q('#m2Alloc').style.display=(totalAsset>0)?'block':'none';
  Q('#stockBar').style.width=sp+'%';Q('#stockBar').textContent=sp>10?sp.toFixed(0)+'% 股票':'';
  Q('#cashBar').style.width=cp+'%';Q('#cashBar').textContent=cp>10?cp.toFixed(0)+'% 现金':'';
  Q('#stockPct').textContent=sp.toFixed(1)+'%';Q('#cashPct').textContent=cp.toFixed(1)+'%';
  Q('#totalAsset').textContent=cash.currency+totalAsset.toFixed(0);
  Q('#cashRatio').textContent='股票/现金 = '+(cash.amount>0?(totalStockVal/cash.amount).toFixed(1):'∞');

// Fetch price from Tencent API (has CORS, GBK encoding)
async function fetchPriceFull(code,mkt){
  try{
    let sym;if(mkt==='hk')sym='hk'+code.padStart(5,'0');else if(mkt==='us')sym='us'+code.toUpperCase();else sym=exg(code,mkt)+code;
    const r=await fetch(`https://qt.gtimg.cn/q=${sym}`);
    const buf=await r.arrayBuffer();const dec=new TextDecoder('gbk');const text=dec.decode(buf);
    const parts=text.split('~');if(parts.length>5)return{price:parseFloat(parts[3]),prev:parseFloat(parts[4])};
  }catch(e){}return null;
}
async function refreshAllPrices(){
  toast('刷新行情中...');let n=0;
  for(const h of holdings){const s=stocks.find(x=>x.id===h.stock_id);if(!s)continue;
    const fp=await fetchPriceFull(s.code,s.market||'sz');
    if(fp&&fp.price>0){await patch(`/rest/v1/holdings?id=eq.${h.id}`,{current_price:fp.price,prev_close:fp.prev||fp.price});n++;}
    await new Promise(r=>setTimeout(r,300));}
  toast('已更新 '+n+' 只');await loadM2();renderM2();
}
async function addHolding(){
  const code=Q('#hCode').value.trim(),name=Q('#hName').value.trim(),mkt=Q('#hMkt').value;
  const shares=parseFloat(Q('#hShares').value)||0,cost=parseFloat(Q('#hCost').value)||0;
  if(!code||!name||!shares||!cost)return toast('请填写完整信息');
  // Find or create stock (match by code only, use auto-detected market)
  const autoMkt=guessMarket(code);
  let allStocks=await get('/rest/v1/stocks?select=*');
  let s=allStocks.find(x=>x.code===code);
  if(!s){
    try{const r=await post('/rest/v1/stocks',{code,name,market:autoMkt,active_from:'2020-01-01'});s=r[0];}catch(e){return toast('创建股票失败：'+e.message)}
  }
  if(s.market!==autoMkt){await patch(`/rest/v1/stocks?id=eq.${s.id}`,{market:autoMkt});s.market=autoMkt}
  if(!s||!s.id)return toast('创建股票失败');
  const fp=await fetchPriceFull(code,mkt);
  await post('/rest/v1/holdings',{stock_id:s.id,shares,avg_cost:cost,current_price:fp?fp.price:0,prev_close:fp?fp.prev||fp.price:0,entry_date:today()});

  const ct=Q('#m2');
  // Init cash inputs
  const cash=loadCash();
  const cAmt=Q('#cashAmount');if(cAmt&&!cAmt._init){cAmt.value=cash.amount||'';cAmt._init=true}
  const cCur=Q('#cashCurrency');if(cCur&&!cCur._init){cCur.value=cash.currency;cCur._init=true}

  let totalVal=0,totalCost=0;
  for(const h of holdings){const p=h.current_price||0;totalVal+=h.shares*p;totalCost+=h.shares*h.avg_cost;}
  const totalPnl=totalVal-totalCost,totalPct=totalCost>0?(totalPnl/totalCost*100):0;
  updateAllocation(totalVal);
  const sum=Q('#m2Summary');
  if(holdings.length>0){sum.style.display='flex';sum.innerHTML='<div>总市值 <span>¥'+totalVal.toFixed(0)+'</span></div><div>总成本 <span>¥'+totalCost.toFixed(0)+'</span></div><div>总盈亏 <span style="color:'+(totalPnl>=0?'var(--buy)':'var(--sell)')+'">'+(totalPnl>=0?'+':'')+totalPnl.toFixed(0)+' ('+(totalPct>=0?'+':'')+totalPct.toFixed(2)+'%)</span></div>';}
  else sum.style.display='none';

  let h='';
  // Add form
  if(showHoldingForm){
    h+='<div class="card"><h3>添加持仓</h3><div class="row"><input id="hCode" placeholder="代码" maxlength="10" autocomplete="off" style="width:90px"><select id="hMkt"><option value="sz">深</option><option value="sh">沪</option><option value="hk">港</option><option value="us">美</option></select><input id="hName" placeholder="名称" maxlength="20" style="flex:1;min-width:100px"><span id="hNameHint" style="font-size:.75rem;color:var(--buy)"></span></div><div class="row"><input id="hShares" placeholder="股数" type="number" step="1" style="width:90px"><input id="hCost" placeholder="成本价" type="number" step="0.01" style="width:110px"><button class="btn btn-sm" id="btnSaveH">保存</button><button class="btn btn-sm btn-out" id="btnCancelH">取消</button></div></div>';
  }

  if(holdings.length===0&&!showHoldingForm){h+='<div class="empty"><div class="icon">📊</div><p>还没有持仓记录</p></div>';}
  else if(holdings.length>0){
    h+='</div></div>';

    // D-board planned stocks not in holdings
    const plannedStocks=stocks.filter(s=>plans.find(p=>p.stock_id===s.id)&&!holdings.find(hd=>hd.stock_id===s.id));
    if(plannedStocks.length>0){
      h+='<div style="margin-bottom:8px;padding:6px 10px;background:rgba(245,158,11,.1);border-radius:6px;font-size:.78rem;color:var(--hold)">📌 纪律看板有计划但未持仓：';
      for(const ps of plannedStocks)h+=esc(ps.code+' '+ps.name)+' ';
      h+='</div>';
    }

    // Table
    const maxPnl=Math.max(...holdings.map(hd=>Math.abs((hd.current_price||0)*hd.shares-hd.shares*hd.avg_cost)),1);
    h+='<div style="overflow-x:auto"><table class="hTable"><thead><tr><th>股票</th><th>持仓</th><th>成本</th><th>现价</th><th>市值</th><th>累计盈亏</th><th>市值占比</th><th>成本占比</th><th></th></tr></thead><tbody>';
    for(const hd of holdings){
      const s=stocks.find(x=>x.id===hd.stock_id);
      const mkt=s?s.market||(s.code.startsWith('6')?'sh':'sz'):'sz';
      const cur=currency(mkt);
      const p=hd.current_price||0;
      const mv=hd.shares*p,tc=hd.shares*hd.avg_cost;
      const pnl=mv-tc,pnlPct=tc>0?(pnl/tc*100):0;
      const weight=totalVal>0?(mv/totalVal*100):0;
      const slWarn=stopLossPct(hd)<-10; // stop loss alert
      const riskWarn=weight>30; // position too heavy
      const rowCls=(riskWarn||slWarn)?' class="risk-warn"':'';
      const barW=Math.min(Math.abs(pnl)/maxPnl*100,100);

      h+='<tr'+rowCls+'>';
      const mktLabel={sh:'沪',sz:'深',hk:'港',us:'美'}[mkt]||'深';
      h+='<td>'+(s?esc(s.code)+' <span class="tag" style="font-size:.6rem;background:rgba(99,102,241,.2);color:var(--acc)">'+mktLabel+'</span> <span style="color:var(--tm);font-size:.78rem">'+esc(s.name)+'</span>':'?')+(hd.entry_date?'<div style="font-size:.65rem;color:var(--td)">建仓 '+hd.entry_date+'</div>':'')+'</td>';
      h+='<td><span class="editable" onclick="editHoldingInline('+hd.id+',\'shares\')">'+hd.shares+'</span></td>';
      h+='<td><span class="editable" onclick="editHoldingInline('+hd.id+',\'avg_cost\')">'+cur+hd.avg_cost.toFixed(2)+'</span></td>';
      h+='<td>'+cur+p.toFixed(2)+'</td><td>'+cur+mv.toFixed(0)+'</td>';
      h+='<td class="'+(pnl>=0?'pnl-pos':'pnl-neg')+' bar-cell">'+(pnl>=0?'+':'')+pnl.toFixed(0)+'<div class="bar-bg '+(pnl>=0?'bar-pos':'bar-neg')+'" style="width:'+barW+'%"></div></td>';
      const costWeight=totalCost>0?(tc/totalCost*100):0;
      h+='<td><div style="font-size:.75rem">'+weight.toFixed(1)+'%</div><div class="wbar"><div class="wbar-fill" style="width:'+weight+'%"></div></div></td>';
      h+='<td><div style="font-size:.75rem">'+costWeight.toFixed(1)+'%</div><div class="wbar"><div class="wbar-fill" style="width:'+costWeight+'%"></div></div></td>';
      h+='<td><button class="btn btn-sm btn-danger" onclick="delHolding('+hd.id+')">删除</button>';
      if(slWarn)h+=' <span class="tag tag-deviated">止损</span>';
      if(riskWarn)h+=' <span class="tag tag-deviated">重仓</span>';
      h+='</td></tr>';
    }
    h+='</tbody></table></div>';
  }
  ct.innerHTML=h;

  setTimeout(()=>{
    const canvas=Q('#pieCanvas');if(!canvas)return;
    const ctx=canvas.getContext('2d'),cx=40,cy=40,r=36;
    ctx.clearRect(0,0,80,80);
    let angle=-Math.PI/2,ci=0;
    for(const hd of holdings){
      const mv=(hd.current_price||0)*hd.shares,wp=totalVal>0?mv/totalVal:0;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,angle,angle+wp*Math.PI*2);
      ctx.fillStyle=colors[ci%colors.length];ctx.fill();
      angle+=wp*Math.PI*2;ci++;
    }
  },100);

  // Bind
  const bs=Q('#btnSaveH');if(bs)bs.onclick=addHolding;
  const bc=Q('#btnCancelH');if(bc)bc.onclick=closeHoldingForm;
  const hc=Q('#hCode');if(hc)hc.onblur=async function(){const c=this.value.trim();if(!c)return;const gm=guessMarket(c);const me=Q('#hMkt');if(me)me.value=gm;const n=await lookupName(c,gm);if(n){const nm=Q('#hName');if(nm)nm.value=n;const nh=Q('#hNameHint');if(nh)nh.textContent='✅ '+n}};
}

// ─── M3: 市场信息（手动链接）───
let notes=[],showNoteForm=false;
async function loadM3(){try{notes=await get(`/rest/v1/market_notes?select=*&note_date=eq.${date}&order=created_at.desc`);}catch(e){notes=[]}}
function closeNoteForm(){showNoteForm=false;renderM3();}
async function addNote(){
  const t=Q('#nTitle').value.trim(),u=Q('#nUrl').value.trim(),sm=Q('#nSummary').value.trim(),s=Q('#nSource').value;
  if(!t)return toast('请输入标题');
  await post('/rest/v1/market_notes',{note_date:date,source:s,title:t,url:u,summary:sm});toast('已添加');closeNoteForm();await loadM3();renderM3();
}
async function delNote(id){await del(`/rest/v1/market_notes?id=eq.${id}`);toast('已删除');await loadM3();renderM3();}
function renderM3(){
  const ct=Q('#m3');let h='';
  if(showNoteForm){
    h+='<div class="card"><h3>添加链接</h3><div class="row"><select id="nSource"><option value="xueqiu">🔵 雪球</option><option value="wechat">🟢 公众号</option><option value="manual">📎 其他</option></select><input id="nTitle" placeholder="标题" style="flex:1;min-width:150px"></div><input id="nUrl" placeholder="链接（可选）" style="width:100%;margin-bottom:4px"><textarea id="nSummary" placeholder="摘要/备注（可选）" style="height:50px;margin-bottom:4px"></textarea><div class="row"><button class="btn btn-sm" id="btnSaveN">保存</button><button class="btn btn-sm btn-out" id="btnCancelN">取消</button></div></div>';
  }
  if(!notes.length&&!showNoteForm)h+='<div class="empty"><div class="icon">📰</div><p>今天还没添加文章</p></div>';
  else for(const n of notes){
    const src={xueqiu:'🔵',wechat:'🟢',manual:'📎'}[n.source]||'📎';
    h+='<div class="note-card"><div class="nmeta">'+src+(n.author?' '+esc(n.author):'')+' · '+n.note_date+'</div>';
    h+='<div class="ntitle">'+(n.url?'<a href="'+esc(n.url)+'" target="_blank" style="color:var(--t)">'+esc(n.title)+'</a>':esc(n.title))+'</div>';
    if(n.summary)h+='<div class="nsummary">'+esc(n.summary)+'</div>';
    h+='<div style="margin-top:4px"><button class="btn btn-sm btn-danger" onclick="delNote('+n.id+')">删除</button></div></div>';
  }
  ct.innerHTML=h;
  const bs=Q('#btnSaveN');if(bs)bs.onclick=addNote;
  const bc=Q('#btnCancelN');if(bc)bc.onclick=closeNoteForm;
}

// ─── Main init ───
function initModules(){
  ['m1body','m2body','m3body'].forEach(id=>{
    const state=localStorage.getItem('mod_'+id);
    if(state==='hidden'){const b=document.getElementById(id),t=document.getElementById(id+'_tgl');if(b){b.classList.add('hidden');t.classList.add('folded')}}
  });
}
async function init(){
  initModules();
  Q('#dInput').value=date;
  QA('#pbar button').forEach(b=>b.classList.toggle('on',b.dataset.p===person));
  Q('#pbar').onclick=e=>{const b=e.target.closest('button');if(!b)return;person=b.dataset.p;localStorage.setItem('sp',person);QA('#pbar button').forEach(x=>x.classList.toggle('on',x.dataset.p===person))};
  Q('#dInput').onchange=()=>{if(Q('#dInput').value)goDate(Q('#dInput').value)};
  Q('#btnPrev').onclick=()=>goDate(shift(date,-1));
  Q('#btnNext').onclick=()=>goDate(shift(date,1));
  Q('#btnToday').onclick=()=>goDate(today());
  // M1 tabs
  QA('#m1tabs button').forEach(b=>b.onclick=function(){activeTab=this.dataset.tab;QA('#m1tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab===activeTab));renderM1()});
  // M2
  Q('#btnRefreshPrice').onclick=refreshAllPrices;
  Q('#btnAddHolding').onclick=()=>{showHoldingForm=true;renderM2()};
  Q('#btnAddNote').onclick=()=>{showNoteForm=true;renderM3()};
  // M3
  // Modal
  Q('#btnCancel').onclick=closeModal;Q('#btnSave').onclick=saveJudgment;
  Q('#modal').onclick=e=>{if(e.target===Q('#modal'))closeModal()};
  Q('#decoGroup').onclick=e=>{const b=e.target.closest('button');if(!b)return;selAction=b.dataset.a;QA('#decoGroup button').forEach(x=>{x.className='';if(x.dataset.a===selAction)x.classList.add('sel-'+selAction)})};
  document.onkeydown=e=>{if(e.key==='Escape')closeModal()};

  try{
    const r=await fetch(API.url+'/rest/v1/stocks?select=id&limit=1',{headers:HG});if(!r.ok)throw new Error('');
    await loadM1();await renderM1();await loadM2();await renderM2();await loadM3();await renderM3();
  }catch(e){Q('#m1').innerHTML='<div class="empty"><div class="icon">🔌</div><p>无法连接 Supabase</p></div>';}
}
async function goDate(d){date=d;Q('#dInput').value=d;await loadM1();await renderM1();await loadM3();await renderM3();}
// Poll every 60s
setInterval(async()=>{await loadM1();await loadM2();await loadM3();},60000);
init();
</script>
