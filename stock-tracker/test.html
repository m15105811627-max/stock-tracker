<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Supabase 连接测试</title></head>
<body>
<h2>Supabase 连接测试</h2>
<div id="result">测试中...</div>
<script>
const URL = 'https://wkhxlgxicirbfyjoelbi.supabase.co';
const KEY = 'sb_publishable_029D-rP7Zdo2dgF4WrniTQ_SMaPVTqT';

async function test() {
  const out = document.getElementById('result');
  out.innerHTML = '1. 测试 fetch...<br>';

  try {
    const r = await fetch(URL + '/rest/v1/stocks?select=id&limit=1', {
      headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
    });
    out.innerHTML += `✅ HTTP ${r.status}<br>`;

    const data = await r.json();
    out.innerHTML += `✅ 响应: ${JSON.stringify(data)}<br>`;
    out.innerHTML += '<br><b style="color:green">连接成功！Supabase 没问题。</b>';
  } catch(e) {
    out.innerHTML += `<b style="color:red">❌ 错误: ${e.message}</b><br>`;
    out.innerHTML += `<br>错误类型: ${e.name}<br>`;
    out.innerHTML += `<br>请把以上信息复制给我`;
    console.error(e);
  }
}
test();
</script>
</body></html>
